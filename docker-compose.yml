version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: contacts-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Your_strong_password123
    ports:
      - '1433:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/backend/Contacts.Api/Dockerfile
    container_name: contacts-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5050
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=ContactsArge24;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;Encrypt=False
      Database__ApplyMigrationsOnStartup: 'true'
    ports:
      - '5050:5050'
    depends_on:
      - sqlserver

  web:
    build:
      context: ./src/frontend/contacts-web
      dockerfile: Dockerfile
    container_name: contacts-web
    ports:
      - '4200:80'
    depends_on:
      - api

volumes:
  sqlserver-data:
