<div class="app-shell">
  <header class="top-bar">
    <a class="brand" routerLink="/contacts">{{ 'APP.TITLE' | translate }}</a>

    <nav class="main-nav">
      <a routerLink="/contacts" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        {{ 'NAV.CONTACTS' | translate }}
      </a>
      <a routerLink="/contacts/import-export" routerLinkActive="active">
        {{ 'NAV.IMPORT_EXPORT' | translate }}
      </a>
    </nav>

    <div class="language-switcher" role="group" aria-label="Language selector">
      @for (language of supportedLanguages; track language) {
        <button
          type="button"
          [class.active]="currentLanguage() === language"
          (click)="switchLanguage(language)">
          {{ language.toUpperCase() }}
        </button>
      }
    </div>
  </header>

  <main class="page-content">
    <router-outlet />
  </main>
</div>
