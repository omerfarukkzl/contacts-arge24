<section class="auth-shell fade-slide-in">
  <section class="page-stack auth-stack">
    <header class="page-hero">
      <span class="page-eyebrow">{{ 'AUTH.RESET_CONTEXT' | translate }}</span>
      <h1>{{ 'AUTH.RESET_TITLE' | translate }}</h1>
      <p>{{ 'AUTH.RESET_SUBTITLE' | translate }}</p>
    </header>

    <section class="surface-panel">
      <div class="panel-body auth-panel-body">
        @if (errorMessage(); as errorKey) {
          <section class="status-banner error">
            <p>{{ errorKey | translate }}</p>
          </section>
        }

        @if (successMessage(); as successKey) {
          <section class="status-banner success">
            <p>{{ successKey | translate }}</p>
          </section>
        }

        <form class="auth-form" [formGroup]="forgotPasswordForm" (ngSubmit)="submit()">
          <label>
            <span>{{ 'AUTH.EMAIL' | translate }}</span>
            <input type="email" formControlName="email" autocomplete="email" />
          </label>

          <button type="submit" class="btn btn-primary" [disabled]="loading()">
            {{ 'AUTH.RESET_BUTTON' | translate }}
          </button>
        </form>

        <div class="auth-links">
          <a routerLink="/auth/login">{{ 'AUTH.BACK_TO_LOGIN' | translate }}</a>
        </div>
      </div>
    </section>
  </section>
</section>
